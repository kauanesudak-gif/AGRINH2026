<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agro Forte - Futuro Sustentável</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>🌱 Agro Forte, Futuro Sustentável</h1>
    <p>Simulação interativa do crescimento da soja</p>
  </header>

  <section class="game">

    <div class="sky">
      <div class="sun" id="sun"></div>
      <div class="cloud"></div>
    </div>

    <div class="info-panel">

      <div class="status">
        <h2>🌿 Nível da Plantação</h2>
        <div id="level">0%</div>
      </div>

      <div class="status">
        <h2>💧 Água</h2>
        <div id="water">50%</div>
      </div>

      <div class="status">
        <h2>🌎 Sustentabilidade</h2>
        <div id="eco">100%</div>
      </div>

    </div>

    <div class="field">

      <div class="soil"></div>

      <div class="soy-container">

        <div class="soy">
          <div class="stem"></div>
          <div class="leaf left"></div>
          <div class="leaf right"></div>
        </div>

      </div>

    </div>

    <div class="controls">
      <button id="rainBtn">🌧️ Regar</button>
      <button id="sunBtn">☀️ Luz Solar</button>
      <button id="fertilizerBtn">🧪 Fertilizante</button>
      <button id="resetBtn">🔄 Reiniciar</button>
    </div>

    <div class="message" id="message">
      Cuide da soja usando recursos sustentáveis 🌱
    </div>

  </section>

  <footer>
    Projeto Agrinho 2026 • Sustentabilidade no Campo 🌎
  </footer>

  <script src="script.js"></script>
</body>
</html>
