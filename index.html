<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Game: AgroForte 2050</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="interface-jogo">
        <header>
            <h1>AGROFORTE GIGANTE: MINI GAME SUSTENTÁVEL</h1>
            <p>Objetivo: Ative a chuva inteligente, espere a soja amadurecer e controle a colheitadeira!</p>
            
            <div class="painel-comandos">
                <button id="btn-chuva" class="btn-acao">🌧️ Ativar Chuva Inteligente</button>
                <button id="btn-colher" class="btn-acao" disabled>🚜 Dirigir Colheitadeira</button>
            </div>
        </header>

        <div class="tela-jogo">
            <div class="camada-ceu">
                <div class="grande-passaro p1">🦅</div>
                <div class="grande-passaro p2">🦅</div>
                
                <div class="sistema-solar">
                    <div class="painel"></div>
                    <div class="painel"></div>
                    <p>🔋 ECO ENERGIA 100%</p>
                </div>
            </div>

            <div id="chuva-efeito" class="chuva-desligada"></div>

            <div class="zona-estruturas">
                <div class="casa-fazenda">🏡<br><span>SEDE</span></div>
                <div class="silo-armazenamento">
                    <div class="cone-silo"></div>
                    <div class="tanque-silo">
                        <p>SILO</p>
                        <div id="display-silo">0%</div>
                    </div>
                </div>
            </div>

            <div class="campo-producao" id="campo-soja">
                </div>

            <div class="super-colheitadeira" id="veiculo-agricola">
                <div class="cabine-piloto">
                    <div class="piloto-agricultor">🧑‍🌾</div>
                </div>
                <div class="chassi-veiculo"></div>
                <div class="sistema-corte"></div>
                <div class="esteiras-rodas">⚙️ ⚙️</div>
            </div>
        </div>

        <footer>
            <p>Missão Agrinho: Produzir com tecnologia protegendo o meio ambiente.</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
