<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Soja Sustentável</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>🌱 Agro Forte, Futuro Sustentável</h1>
    <p>Simulação interativa da plantação de soja</p>
  </header>

  <main>

    <section class="painel">

      <div class="card">
        <h2>🌾 Crescimento</h2>
        <span id="growthText">0%</span>
      </div>

      <div class="card">
        <h2>💧 Água</h2>
        <span id="waterText">50%</span>
      </div>

      <div class="card">
        <h2>🌎 Sustentabilidade</h2>
        <span id="ecoText">100%</span>
      </div>

    </section>

    <section class="campo">

      <div class="ceu">
        <div class="sol"></div>
      </div>

      <div class="plantacao">

        <div class="soja" id="soja">
          <div class="caule"></div>

          <div class="folha folha1"></div>
          <div class="folha folha2"></div>
          <div class="folha folha3"></div>
          <div class="folha folha4"></div>
        </div>

      </div>

      <div class="terra"></div>

    </section>

    <section class="controles">

      <button id="waterBtn">🌧️ Regar</button>

      <button id="sunBtn">☀️ Sol</button>

      <button id="harvestBtn">🌾 Colheita</button>

      <button id="resetBtn">🔄 Reiniciar</button>

    </section>

    <div class="mensagem" id="message">
      Cuide da soja sem prejudicar o meio ambiente 🌿
    </div>

  </main>

  <footer>
    Projeto Agrinho 2026 🌎
  </footer>

  <script src="script.js"></script>

</body>
</html>
