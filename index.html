<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agro 2050 - Fazenda Sustentável</title>

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>🌱 Agro Forte 2050</h1>
    <p>Futuro sustentável entre tecnologia e natureza</p>
  </header>

  <section class="dashboard">

    <div class="card">
      <h2>🌾 Crescimento</h2>
      <span id="growthText">0%</span>
    </div>

    <div class="card">
      <h2>💧 Água</h2>
      <span id="waterText">50%</span>
    </div>

    <div class="card">
      <h2>🌎 Sustentabilidade</h2>
      <span id="ecoText">100%</span>
    </div>

  </section>

  <section class="farm">

    <div class="sky">

      <div class="sun"></div>

      <div class="cloud"></div>

      <div class="bird bird1">🕊️</div>
      <div class="bird bird2">🦋</div>

    </div>

    <div class="future-city">
      🛰️ 🚁 🌐
    </div>

    <div class="tractor" id="tractor">
      🚜
    </div>

    <div class="soy-field">

      <div class="soy" id="soy1">
        <div class="stem"></div>
        <div class="leaf left"></div>
        <div class="leaf right"></div>
      </div>

      <div class="soy" id="soy2">
        <div class="stem"></div>
        <div class="leaf left"></div>
        <div class="leaf right"></div>
      </div>

      <div class="soy" id="soy3">
        <div class="stem"></div>
        <div class="leaf left"></div>
        <div class="leaf right"></div>
      </div>

      <div class="soy" id="soy4">
        <div class="stem"></div>
        <div class="leaf left"></div>
        <div class="leaf right"></div>
      </div>

      <div class="soy" id="soy5">
        <div class="stem"></div>
        <div class="leaf left"></div>
        <div class="leaf right"></div>
      </div>

    </div>

    <div class="ground"></div>

  </section>

  <section class="controls">

    <button id="rainBtn">🌧️ Chuva Inteligente</button>

    <button id="sunBtn">☀️ Energia Solar</button>

    <button id="futureBtn">🛰️ Agro 2050</button>

    <button id="resetBtn">🔄 Reiniciar</button>

  </section>

  <div class="message" id="message">
    Cuide da plantação usando tecnologia sustentável 🌿
  </div>

  <footer>
    Projeto Agrinho 2026 • Agro Forte Futuro Sustentável 🌎
  </footer>

  <audio id="rainSound">
    <source src="https://www.soundjay.com/nature/rain-01.mp3" type="audio/mpeg">
  </audio>

  <script src="script.js"></script>

</body>
</html>
