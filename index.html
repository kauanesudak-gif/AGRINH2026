<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agrinho 2050: Agro Forte e Sustentável</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Agro Forte, Futuro Sustentável</h1>
        <p>Equilíbrio Perfeito entre Produção e Meio Ambiente</p>
        <div class="paineis-controle">
            <button id="btn-chuva">🌧️ Ativar Chuva Inteligente</button>
            <button id="btn-colher" disabled>🚜 Iniciar Colheita Interativa</button>
        </div>
    </header>

    <main class="cenario">
        <div class="ceu">
            <div class="passaro p1">🦅</div>
            <div class="passaro p2">🦅</div>
            <div class="passaro p3">🦅</div>
            
            <div class="painel-solar">
                <div class="placa"></div>
                <div class="placa"></div>
                <span>☀️ Energia Solar Ativa</span>
            </div>
        </div>

        <div id="chuva-container" class="chuva-desativada"></div>

        <div class="estruturas">
            <div class="fazenda" title="Sede da Fazenda Sustentável">🏡<br>Sede</div>
            <div class="silo">
                <div class="telhado-silo"></div>
                <div class="corpo-silo">
                    <span>SILO</span>
                    <div id="status-silo">0%</div>
                </div>
            </div>
        </div>

        <div class="campo-soja" id="campo">
            </div>

        <div class="colheitadeira" id="maquina">
            <div class="cabine">
                <div class="operador" title="Produtor operando com tecnologia">🧑‍🌾</div>
            </div>
            <div class="corpo-maquina"></div>
            <div class="plataforma-corte"></div>
            <div class="rodas">⚙️ ⚙️</div>
        </div>
    </main>

    <footer>
        <p>Projeto Agrinho: Tecnologia e Sustentabilidade no Campo</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
