<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agrinho 2050: Agro Forte e Sustentável</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Agro Forte, Futuro Sustentável: 2050</h1>
        <p>Equilíbrio perfeito entre alta produção tecnológica e preservação ambiental.</p>
        <div class="controles">
            <button id="btn-chuva">🌧️ Iniciar Chuva Ecológica</button>
            <button id="btn-colher" disabled>🚜 Iniciar Colheita Autônoma</button>
        </div>
    </header>

    <main class="cenario">
        <div class="nuvens"></div>
        <div id="chuva-container" class="chuva-escondida"></div>

        <div class="energia-solar">☀️ Painéis Solares Ativos</div>
        <div class="biodiversidade">🦌 Reserva de Animais Nativos</div>

        <div class="silo">
            <div class="topo-silo"></div>
            <div class="corpo-silo">SILO 2050<br><span id="Painel-silo">0%</span></div>
        </div>

        <div class="campo-soja" id="campo">
            </div>

        <div class="colheitadeira" id="maquina">
            <div class="cabine">
                <div class="operador" title="Operador monitorando IA">🧑‍✈️</div>
            </div>
            <div class="plataforma"></div>
            <div class="rodas">⚙️ ⚙️</div>
        </div>
    </main>

    <footer>
        <p>Projeto AgroForte 2050 - Cultivando a vida com equilíbrio e tecnologia.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
