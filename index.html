<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agrinho: Agro Forte e Sustentável</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>AGRO FORTE, FUTURO SUSTENTÁVEL</h1>
        <p>O Equilíbrio Perfeito entre Produção e Meio Ambiente</p>
        <div class="paineis-controle">
            <button id="btn-chuva">🌧️ Ativar Chuva Inteligente</button>
            <button id="btn-colher" disabled>🚜 Iniciar Grande Colheita</button>
        </div>
    </header>

    <main class="cenario">
        <div class="ceu">
            <div class="passaro p1">🦅</div>
            <div class="passaro p2">🦅</div>
            
            <div class="painel-solar-gigante">
                <div class="placa-solar"></div>
                <div class="placa-solar"></div>
                <p>☀️ ENERGIA LIMPA</p>
            </div>
        </div>

        <div id="chuva-container" class="chuva-desativada"></div>

        <div class="estruturas-grupo">
            <div class="grande-fazenda">🏡<br><span class="legenda">SEDE</span></div>
            <div class="grande-silo">
                <div class="tampa-silo"></div>
                <div class="corpo-silo">
                    <p>SILO 2050</p>
                    <div id="status-silo">0%</div>
                </div>
            </div>
        </div>

        <div class="campo-soja-grande" id="campo">
            </div>

        <div class="colheitadeira-gigante" id="maquina">
            <div class="cabine-grande">
                <div class="grande-operador" title="Produtor do Futuro">🧑‍🌾</div>
            </div>
            <div class="chassi-maquina"></div>
            <div class="plataforma-frontal"></div>
            <div class="grandes-rodas">⚙️ ⚙️</div>
        </div>
    </main>

    <footer>
        <p>Projeto Agrinho — Conectando a tecnologia do futuro com a preservação ambiental.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
